# TaxNexus production routing.
#   :80   -> ACME http-01 challenge + 301 redirect to https
#   :443  -> taxnexusapp.com / www  => SvelteKit app (app:3000)
#   :443  -> cms.taxnexusapp.com     => Strapi (strapi:1337)
#   :8082 -> Mautic (fastcgi), internal admin (no public TLS in this iteration)
#
# One Let's Encrypt cert covers taxnexusapp.com + www + cms (live/taxnexusapp.com/).
# scripts/init-letsencrypt.sh seeds a dummy cert so nginx can start before issuance.
#
# This file is mounted at conf.d/default.conf (inside the base image's http{}),
# so directives here before the server blocks apply in the http context.

# ---- Compression -------------------------------------------------------------
# Shrinks text payloads (HTML/CSS/JS/JSON/SVG/fonts) for global / low-bandwidth
# users; applies to the proxied app + CMS responses. text/html is always gzipped
# by nginx, so it's intentionally not listed below. (Brotli would compress a bit
# better but needs a brotli-enabled nginx image; gzip is universally available.)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/woff2;

# ---- Cloudflare real client IP ----------------------------------------------
# When Cloudflare proxies the site, every request reaches nginx from a Cloudflare
# edge IP. Without this block the app would see only a handful of edge IPs and
# collapse every visitor into one rate-limit bucket (a trivial DoS) and one geo,
# breaking both the per-IP limiter and the cf-ipcountry consent gate.
#
# `set_real_ip_from` lists the ONLY sources nginx will trust to report a client
# IP, so this is safe to ship BEFORE the DNS cutover: a direct-to-origin client
# is not in these ranges, so any CF-Connecting-IP header it forges is ignored and
# its real socket IP is used. Once Cloudflare is in front, nginx reads the true
# client IP from CF-Connecting-IP and X-Real-IP / X-Forwarded-For reflect it.
#
# Ranges from https://www.cloudflare.com/ips (fetched 2026-07-18). Refresh if
# Cloudflare publishes changes. IPv4:
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6:
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# Cloudflare sends the origin client's IP in CF-Connecting-IP.
real_ip_header CF-Connecting-IP;

# ---- :80  ACME + redirect ----------------------------------------------------
server {
    listen 0.0.0.0:80;
    server_name taxnexusapp.com www.taxnexusapp.com cms.taxnexusapp.com;

    # Certbot webroot challenge — must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- :443  SvelteKit app (apex + www) ---------------------------------------
server {
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name taxnexusapp.com www.taxnexusapp.com;

    ssl_certificate     /etc/letsencrypt/live/taxnexusapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxnexusapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---- :443  Strapi CMS (cms subdomain) ---------------------------------------
server {
    listen 0.0.0.0:443 ssl;
    http2 on;
    server_name cms.taxnexusapp.com;

    ssl_certificate     /etc/letsencrypt/live/taxnexusapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxnexusapp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;  # Strapi media uploads

    location / {
        proxy_pass http://strapi:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- :8082  Mautic (internal admin, fastcgi) --------------------------------
server {
    listen 0.0.0.0:8082;
    server_name _;

    root /var/www/html/docroot;

    location / {
        index index.php;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass mautic_web:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
    }
}
