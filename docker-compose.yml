x-soloai-volumes:
  &soloai-volumes
  - ${BASE_PATH}/mautic/config:/var/www/html/config:z
  - ${BASE_PATH}/mautic/logs:/var/www/html/var/logs:z
  - ${BASE_PATH}/mautic/media/files:/var/www/html/docroot/media/files:z
  - ${BASE_PATH}/mautic/media/images:/var/www/html/docroot/media/images:z
  - ${BASE_PATH}/cron:/opt/mautic/cron:z
  - mautic-docroot:/var/www/html/docroot:z

services:
  db:
    image: mysql:lts
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:3307:3306"
    volumes: 
      - ${BASE_PATH}/mysql-data:/var/lib/mysql
      - ./init-strapi-db.sql:/docker-entrypoint-initdb.d/init-strapi-db.sql
    healthcheck:
      test: mysqladmin --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD ping
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - mautic-docroot:/var/www/html/docroot:z
      - ./mautic/media/files:/var/www/html/docroot/media/files:z
      - ./mautic/media/images:/var/www/html/docroot/media/images:z
      # TLS material + ACME webroot, shared with the certbot service.
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - mautic_web
      - app
      - strapi
    ports:
      - 80:80      # taxnexusapp.com — ACME challenge + 301 to https
      - 443:443    # taxnexusapp.com (app) + cms.taxnexusapp.com (strapi), TLS
      - 8082:8082  # mautic admin (internal/no public TLS in this iteration)
    # Reload every 6h so renewed certs are picked up without a restart.
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    networks:
       - default
  
  mautic_web:
    image: mautic/mautic:6-fpm
    links:
      - db:mysql
    volumes: *soloai-volumes
    environment:
      - DOCKER_MAUTIC_LOAD_TEST_DATA=${DOCKER_MAUTIC_LOAD_TEST_DATA}
      - DOCKER_MAUTIC_RUN_MIGRATIONS=${DOCKER_MAUTIC_RUN_MIGRATIONS}
    env_file:
      - .mautic_env
    healthcheck:
      test: cgi-fcgi -bind -connect 127.0.0.1:9000
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 100
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  mautic_cron:
    image: mautic/mautic:6-fpm
    links:
      - db:mysql
    volumes: *soloai-volumes
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_cron
    env_file:
      - .mautic_env
    depends_on:
      mautic_web:
        condition: service_healthy
    networks:
      - default

  mautic_worker:
    image: mautic/mautic:6-fpm
    links:
      - db:mysql
    volumes: *soloai-volumes
    environment:
      - DOCKER_MAUTIC_ROLE=mautic_worker
    env_file:
      - .mautic_env
    depends_on:
      mautic_web:
        condition: service_healthy
    networks:
      - default

  strapi:
    build:
      context: .
      dockerfile: Dockerfile.strapi
    environment:
      NODE_ENV: development # or production
      DATABASE_CLIENT: mysql
      DATABASE_HOST: ${MYSQL_HOST}
      DATABASE_PORT: ${MYSQL_PORT}
      DATABASE_NAME: strapi_db
      DATABASE_USERNAME: ${MYSQL_STRAPI_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      STRAPI_ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      DATABASE_SSL: false
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      db:
        condition: service_healthy
    # Removed volume mount - was overwriting built app files
    networks:
      - default

  # SvelteKit (TaxNexus) production app — served at https://taxnexusapp.com via nginx.
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        # Inlined into the client bundle at build — must be the real public origins.
        PUBLIC_STRAPI_URL: https://cms.taxnexusapp.com
        STRAPI_API_URL: https://cms.taxnexusapp.com
        BETTER_AUTH_URL: https://taxnexusapp.com
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # adapter-node runtime
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: https://taxnexusapp.com
      # Server-to-Strapi must be HTTPS in production (env validator) — hairpins via nginx.
      STRAPI_API_URL: https://cms.taxnexusapp.com
      PUBLIC_STRAPI_URL: https://cms.taxnexusapp.com
      BETTER_AUTH_URL: https://taxnexusapp.com
      DATABASE_AUTH_PATH: /app/data/auth.sqlite
    volumes:
      # Persist Better Auth SQLite + JSON billing store across deploys.
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  # TLS issuance + renewal (Let's Encrypt, webroot challenge). Shares volumes with nginx.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Try renewal twice a day; nginx reloads on its own 6h timer to pick up new certs.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"
    networks:
      - default

volumes:
  mysql-data:
    driver: local
    driver_opts:
      type: none
      device: ${BASE_PATH}/mysql-data
      o: bind
  mautic-docroot:
    driver: local
    driver_opts:
      type: none
      device: ${BASE_PATH}/mautic-docroot
      o: bind
  strapi-app:
    driver: local
    driver_opts:
      type: none
      device: ${BASE_PATH}/strapi
      o: bind
  # SvelteKit app persistent state (Better Auth SQLite + JSON billing store).
  # Bind-mounted to a host path (like mysql-data/strapi) so accounts survive
  # container rebuilds AND are not lost to `docker compose down -v` / volume prune.
  # NOTE: the host dir must exist before `up` — `mkdir -p ${BASE_PATH}/app-data`.
  app-data:
    driver: local
    driver_opts:
      type: none
      device: ${BASE_PATH}/app-data
      o: bind
  # Let's Encrypt certs + ACME webroot, shared between nginx and certbot.
  certbot-etc:
    driver: local
  certbot-www:
    driver: local

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-docker
