name: deploy

# Ships to the VPS after CI passes on main. Also runnable on demand
# (workflow_dispatch) with a branch override for hotfix deploys.
on:
  workflow_run:
    workflows: ['ci']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy on the VPS'
        required: true
        default: 'main'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # On the CI-triggered path, only deploy if CI actually succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # VPS_APP_DIR = absolute path to the cloned repo on the VPS.
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            DEPLOY_BRANCH="${{ github.event.inputs.branch || 'main' }}" ./scripts/deploy.sh
